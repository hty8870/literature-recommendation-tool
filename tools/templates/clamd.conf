Foreground yes
LocalSocket /run/citation-av/clamd.sock
LocalSocketGroup citation
LocalSocketMode 660
FixStaleSocket yes
User clamav
DatabaseDirectory /var/lib/clamav
PidFile /run/citation-av/clamd.pid
LogTime yes
LogClean no
LogVerbose no
MaxThreads 1
MaxQueue 4
ReadTimeout 60
CommandReadTimeout 10
IdleTimeout 30
SelfCheck 300
ConcurrentDatabaseReload no
MaxScanTime 60000
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 200M
MaxRecursion 16
MaxFiles 10000
AlertExceedsMax yes
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanXMLDOCS yes
